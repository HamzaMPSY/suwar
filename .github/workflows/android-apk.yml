name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pixel ARM64 · development-signed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      # Override the larger local-development settings without changing the app.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8"
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.parallel=false
        -Dkotlin.daemon.jvm.options=-Xmx1g
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Pixel ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Prepare APK, checksum and build metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          source = Path('build/app/outputs/flutter-apk/app-release.apk')
          if not source.is_file() or source.stat().st_size == 0:
              raise SystemExit(f'Missing or empty compiled APK: {source}')
          output = Path('artifacts')
          output.mkdir(exist_ok=True)
          apk = output / 'suwar-pixel-arm64-development-signed.apk'
          shutil.copy2(source, apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (output / 'SHA256SUMS').write_text(f'{digest}  {apk.name}\n')
          flutter = json.loads(subprocess.check_output(
              ['flutter', '--version', '--machine'], text=True,
          ))
          version = next(line.partition(':')[2].strip()
                         for line in Path('pubspec.yaml').read_text().splitlines()
                         if line.startswith('version:'))
          metadata = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'version': version,
              'target': 'android-arm64',
              'buildMode': 'release',
              'signing': 'development/debug; runner-generated certificate',
              'flutterVersion': flutter['frameworkVersion'],
              'dartVersion': flutter['dartSdkVersion'],
              'javaVersion': '17',
              'apk': apk.name,
              'apkBytes': apk.stat().st_size,
              'sha256': digest,
          }
          (output / 'BUILD_INFO.json').write_text(
              json.dumps(metadata, indent=2) + '\n',
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Pixel ARM64 development-signed APK\n\n')
              summary.write(f'Version: `{version}` · commit: `{metadata["commit"]}`\n\n')
              summary.write(f'SHA256: `{digest}`\n\n')
              summary.write('Download the artifact below and extract the APK. '
                            'The runner debug certificate may differ from an existing '
                            'Pixel installation; update installation requires a matching certificate.\n')
          PY

      - name: Upload development-signed APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suwar-pixel-arm64-development-signed-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/suwar-pixel-arm64-development-signed.apk
            artifacts/SHA256SUMS
            artifacts/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  publish:
    name: Publish development-signed GitHub Release
    needs: build
    if: >-
      github.repository == 'HamzaMPSY/suwar' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact successful build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: artifacts
          merge-multiple: true

      - name: Verify release files and source identity
        id: release
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          folder = Path('artifacts')
          apk = folder / 'suwar-pixel-arm64-development-signed.apk'
          expected = {apk.name, 'SHA256SUMS', 'BUILD_INFO.json'}
          if {p.name for p in folder.iterdir()} != expected:
              raise SystemExit('Release must contain exactly the three build files')
          metadata = json.loads((folder / 'BUILD_INFO.json').read_text())
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          run_url = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          checks = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'runUrl': run_url,
              'target': 'android-arm64',
              'buildMode': 'release',
              'signing': 'development/debug; runner-generated certificate',
              'apk': apk.name,
              'apkBytes': apk.stat().st_size,
              'sha256': digest,
          }
          if not apk.stat().st_size or any(metadata.get(k) != v for k, v in checks.items()):
              raise SystemExit('APK checksum or build identity does not match this run')
          if (folder / 'SHA256SUMS').read_text() != f'{digest}  {apk.name}\n':
              raise SystemExit('SHA256SUMS does not match the APK')
          version = metadata.get('version', '')
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Invalid app version in build metadata')
          attempt = f"{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          tag = f"v{version.split('+')[0]}-build.{attempt}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\ntitle=Suwar {version} · build {attempt}\n')
          Path('release-notes.md').write_text(
              f'Suwar {version} · Pixel ARM64 · development-signed APK\n\n'
              f'Source commit: `{metadata["commit"]}`\n\nBuild: {run_url}\n\n'
              f'APK SHA256: `{digest}`\n\n'
              'Download the APK, SHA256SUMS and BUILD_INFO.json below. '
              'This runner-generated debug certificate may differ from your installed app. '
              'Updating requires a matching signing certificate; preserve your app and data '
              'if Android rejects the update. This is not a production-signed store release.\n'
          )
          PYTHON

      - name: Upload draft assets, verify and publish Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GH_REPO']
          existing = subprocess.run(
              ['gh', 'api', '--include', f'repos/{repo}/git/ref/tags/{tag}'],
              capture_output=True, text=True,
          )
          if existing.returncode == 0:
              raise SystemExit('Refusing to reuse an existing release tag')
          if not re.search(r'^HTTP/\S+ 404(?: |$)', existing.stdout, re.MULTILINE):
              raise SystemExit('Cannot establish tag absence; refusing publication: ' + existing.stderr)
          files = sorted(Path('artifacts').iterdir())
          subprocess.run([
              'gh', 'release', 'create', tag, '--draft', '--target', os.environ['GITHUB_SHA'],
              '--title', os.environ['RELEASE_TITLE'], '--notes-file', 'release-notes.md',
              *map(str, files),
          ], check=True)
          release = json.loads(subprocess.check_output(
              ['gh', 'release', 'view', tag, '--json', 'isDraft,assets,url'], text=True,
          ))
          assets = {a['name']: a['size'] for a in release['assets'] if a['state'] == 'uploaded'}
          if not release['isDraft'] or assets != {p.name: p.stat().st_size for p in files}:
              raise SystemExit('Draft assets are incomplete; leaving release unpublished')
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/releases/tag/{tag}"
              summary.write(f'### Published GitHub Release\n\n{url}\n')
          PYTHON
